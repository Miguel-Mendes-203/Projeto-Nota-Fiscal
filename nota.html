<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro da Nota</title>
<link rel="stylesheet" href="css/nota.css">
</head>
<body>
<main class="tela">
  <h1>Cadastro<br>da<br>Nota</h1>
  <form>
    <label class="codigo">Código <input type="text"></label>
    <label class="emissao">Data de Emissão <input type="date"></label>
    <label class="valor">Valor Total <input type="number" step="0.01"></label>
    <label class="envio">Data de Envio <input type="date"></label>
    <label class="cnpj">CNPJ <input type="text"></label>
    <a href="home.html" class="btn escuro menu">Menu</a>
    <button type="submit" class="btn claro cadastrar">Cadastrar</button>
  </form>
</main>
</body>
</html>
